<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — tetr4.dev</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Neue Haas Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #000;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .mono {
      font-family: 'SF Mono', Monaco, 'Cascadia Code', 'Roboto Mono', Consolas, 'Courier New', monospace;
    }

    .login-container {
      width: 100%;
      max-width: 400px;
      padding: 2rem;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 3rem;
    }

    .logo-icon {
      width: 2.5rem;
      height: 2.5rem;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-text {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .login-header {
      margin-bottom: 2rem;
    }

    .login-title {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }

    .login-subtitle {
      font-size: 0.875rem;
      color: #737373;
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-label {
      display: block;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #737373;
      margin-bottom: 0.5rem;
    }

    .form-input {
      width: 100%;
      background: #000;
      border: 1px solid #262626;
      color: #fff;
      padding: 0.75rem;
      font-size: 0.875rem;
      font-family: inherit;
      transition: border-color 0.2s;
    }

    .form-input:focus {
      outline: none;
      border-color: #525252;
    }

    .form-input::placeholder {
      color: #525252;
    }

    .form-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .checkbox {
      width: 1rem;
      height: 1rem;
      cursor: pointer;
      accent-color: #fff;
    }

    .checkbox-label {
      font-size: 0.75rem;
      color: #737373;
      cursor: pointer;
    }

    .forgot-link {
      font-size: 0.75rem;
      color: #737373;
      text-decoration: none;
      transition: color 0.2s;
    }

    .forgot-link:hover {
      color: #fff;
    }

    .submit-btn {
      width: 100%;
      background: #fff;
      color: #000;
      border: none;
      padding: 0.875rem;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-bottom: 1rem;
    }

    .submit-btn:hover {
      background: #e5e5e5;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin: 2rem 0;
    }

    .divider-line {
      flex: 1;
      height: 1px;
      background: #262626;
    }

    .divider-text {
      font-size: 0.75rem;
      color: #525252;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .social-btn {
      width: 100%;
      background: #000;
      color: #fff;
      border: 1px solid #262626;
      padding: 0.875rem;
      font-size: 0.875rem;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
    }

    .social-btn:hover {
      border-color: #525252;
      background: #0a0a0a;
    }

    .signup-link {
      text-align: center;
      font-size: 0.875rem;
      color: #737373;
      margin-top: 2rem;
    }

    .signup-link a {
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s;
    }

    .signup-link a:hover {
      color: #e5e5e5;
    }

    .footer-note {
      margin-top: 3rem;
      padding-top: 2rem;
      border-top: 1px solid #262626;
      font-size: 0.75rem;
      color: #525252;
      text-align: center;
      line-height: 1.6;
    }

    .footer-note a {
      color: #737373;
      text-decoration: none;
      transition: color 0.2s;
    }

    .footer-note a:hover {
      color: #fff;
    }

    .icon {
      width: 1.25rem;
      height: 1.25rem;
      display: inline-block;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo">
      <div class="logo-icon">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
          <path d="M2 17l10 5 10-5"></path>
          <path d="M2 12l10 5 10-5"></path>
        </svg>
      </div>
      <span class="logo-text">tetr4.dev</span>
    </div>

    <div class="login-header">
      <h1 class="login-title">Sign in to your account</h1>
      <p class="login-subtitle">Deploy and manage your Aether instances</p>
    </div>

    <form>
      <div class="form-group">
        <label class="form-label mono" for="email">Email Address</label>
        <input 
          type="email" 
          id="email" 
          class="form-input mono" 
          placeholder="name@company.com"
        >
      </div>

      <div class="form-group">
        <label class="form-label mono" for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          class="form-input mono" 
          placeholder="Enter your password"
        >
      </div>

      <div class="form-footer">
        <div class="checkbox-group">
          <input type="checkbox" id="remember" class="checkbox">
          <label for="remember" class="checkbox-label">Remember me</label>
        </div>
        <a href="#" class="forgot-link">Forgot password?</a>
      </div>

      <button type="submit" class="submit-btn">Sign In</button>
    </form>

    <div class="divider">
      <div class="divider-line"></div>
      <span class="divider-text mono">Or continue with</span>
      <div class="divider-line"></div>
    </div>

    <button class="social-btn">
      <svg class="icon" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
      </svg>
      GitHub
    </button>

    <button class="social-btn">
      <svg class="icon" viewBox="0 0 24 24" fill="currentColor">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
      </svg>
      Google
    </button>

    <div class="signup-link">
      Don't have an account? <a href="#">Create one</a>
    </div>

    <div class="footer-note mono">
      By signing in, you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
    </div>
  </div>
</body>
</html>
