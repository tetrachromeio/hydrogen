[model]
name = "App"
table = "apps"

[fields.id]
type = "string"
primary_key = true

[fields.slug]
type = "string"
unique = true
nullable = false

[fields.default_domain]
type = "string"
nullable = true

[fields.current_release_id]
type = "string"
nullable = true
foreign_key = "Releases.id"

[fields.created_at]
type = "datetime"
default = "now"

[fields.updated_at]
type = "datetime"
default = "now"
