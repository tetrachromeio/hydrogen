[model]
name = "Release"
table = "releases"

[fields.id]
type = "string"
primary_key = true

[fields.app_id]
type = "string"
nullable = false
foreign_key = "Apps.id"

[fields.image]
type = "string"
nullable = false

[fields.config_version]
type = "string"
nullable = false

[fields.status]
type = "string" 
default = "deploying"   # deploying | ready | failed

[fields.created_at]
type = "datetime"
default = "now"
